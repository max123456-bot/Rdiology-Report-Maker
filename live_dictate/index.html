<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Live dictation</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent;
               font-family: "Source Sans Pro", Arial, Helvetica, sans-serif; }

  #root { display: flex; flex-direction: column; gap: 10px; }

  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  button {
    border: 1px solid #d0d6e0; background: #fff; color: #1f2937;
    border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer;
    font-family: inherit;
  }
  button:hover:not(:disabled) { background: #f2f6fc; border-color: #9fb6d8; }
  button:disabled { opacity: .45; cursor: default; }
  button.rec { background: #e8433a; border-color: #e8433a; color: #fff; font-weight: 600; }
  button.rec:hover:not(:disabled) { background: #cf372f; border-color: #cf372f; }
  button.stop { background: #1f2937; border-color: #1f2937; color: #fff; font-weight: 600; }

  #dot {
    width: 11px; height: 11px; border-radius: 50%; background: #c9d0da;
    flex: 0 0 auto;
  }
  #dot.live { background: #e8433a; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  #status { font-size: 13px; color: #5a6b83; }
  #timer { font-size: 13px; color: #5a6b83; font-variant-numeric: tabular-nums; }

  /* Level meter - proves the mic is actually hearing something. Its fill is
     the CLEANED signal, so the doctor sees the noise gate working. */
  #meter { flex: 1 1 120px; height: 6px; background: #e7ebf1; border-radius: 3px;
           overflow: hidden; min-width: 80px; position: relative; }
  #level { height: 100%; width: 0%; background: #3ea15b; transition: width .08s linear; }
  #meter.hot #level { background: #e8b53a; }
  #gateMark { position: absolute; top: -2px; bottom: -2px; width: 2px;
              background: #b04632; opacity: .55; }
  #meter.gated #level { background: #c9d0da; }

  #box {
    min-height: 190px; max-height: 460px; overflow-y: auto;
    border: 1px solid #d5dae2; border-radius: 10px; padding: 14px 16px;
    background: #fff; color: #111; font-size: 15px; line-height: 1.65;
    white-space: pre-wrap; outline: none;
  }
  #box:focus { border-color: #9fb6d8; box-shadow: 0 0 0 3px rgba(120,160,220,.16); }
  #box.empty::before {
    content: attr(data-placeholder); color: #9aa4b2;
  }
  #interim { color: #8a94a3; font-style: italic; }

  .hint { font-size: 12.5px; color: #7a8699; }
  .warn { font-size: 13px; color: #8a5a00; background: #fff6e5;
          border: 1px solid #f0dcae; border-radius: 8px; padding: 9px 12px; }
  #nr { font-size: 12.5px; color: #5a6b83; }
  #nr b { color: #2c7a4b; }
</style>
</head>
<body>
  <div id="root">
    <div class="bar">
      <button id="start" class="rec" type="button">● Start speaking</button>
      <button id="stop" class="stop" type="button" disabled>■ Stop &amp; transcribe</button>
      <span id="dot"></span>
      <span id="timer">00:00</span>
      <div id="meter"><div id="level"></div><span id="gateMark"></span></div>
      <span id="status">Ready</span>
    </div>

    <div id="box" contenteditable="true" spellcheck="false"
         data-placeholder="Your words appear here as you speak. You can edit them at any time."></div>

    <div class="hint" id="hint">
      Speak normally. You can type or correct in the box while you talk.
    </div>
    <div id="nr"></div>
  </div>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------ //
  // Streamlit component protocol
  // ------------------------------------------------------------------ //
  function post(type, data) {
    var msg = { isStreamlitMessage: true, type: type };
    for (var k in data) msg[k] = data[k];
    window.parent.postMessage(msg, "*");
  }
  function setValue(v) { post("streamlit:setComponentValue", { value: v, dataType: "json" }); }

  var lastH = 0;
  function syncHeight() {
    var root = document.getElementById("root");
    if (!root) return;
    var h = Math.ceil(root.getBoundingClientRect().height) + 10;
    if (Math.abs(h - lastH) > 1) { lastH = h; post("streamlit:setFrameHeight", { height: h }); }
  }

  var startBtn = document.getElementById("start");
  var stopBtn  = document.getElementById("stop");
  var box      = document.getElementById("box");
  var statusEl = document.getElementById("status");
  var timerEl  = document.getElementById("timer");
  var dot      = document.getElementById("dot");
  var level    = document.getElementById("level");
  var meter    = document.getElementById("meter");
  var hint     = document.getElementById("hint");
  var nrEl     = document.getElementById("nr");

  var finalText = "";
  var interimText = "";
  var recognition = null;
  var recognitionWanted = false;
  var recorder = null;
  var chunks = [];
  var stream = null;             // the raw microphone stream
  var recordStream = null;       // what the recorder captures (cleaned, when on)
  var audioCtx = null, analyser = null, rafId = null, gateNode = null;
  var startedAt = 0, tickId = null;
  var MAX_MB = 12;

  // Noise-reduction settings, overridable from Streamlit via component args.
  var cfg = {
    denoise: true,       // the Web-Audio cleaning graph
    strength: 0.5,       // 0..1 - drives the noise-gate threshold
    lang: "en-IN"
  };

  // Streamlit hands args on every render. Read them so the Python side can
  // turn the cleaning on/off and set its strength.
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.type !== "streamlit:render" || !d.args) return;
    var a = d.args;
    if (typeof a.denoise === "boolean") cfg.denoise = a.denoise;
    if (typeof a.strength === "number") cfg.strength = Math.max(0, Math.min(1, a.strength));
    if (typeof a.lang === "string" && a.lang) cfg.lang = a.lang;
    describeNR();
  });

  function describeNR() {
    if (cfg.denoise) {
      var pct = Math.round(cfg.strength * 100);
      nrEl.innerHTML = "Noise cancellation <b>on</b> — rumble and hiss filtered, " +
        "background between phrases gated (sensitivity " + pct + "%). " +
        "The bar shows the cleaned signal.";
    } else {
      nrEl.textContent = "Noise cancellation off — recording the raw microphone.";
    }
    syncHeight();
  }

  function setStatus(text) { statusEl.textContent = text; syncHeight(); }

  function render() {
    var safe = function (s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    };
    box.innerHTML = safe(finalText) + (interimText ? '<span id="interim">' + safe(interimText) + "</span>" : "");
    box.classList.toggle("empty", !finalText && !interimText);
    box.scrollTop = box.scrollHeight;
    syncHeight();
  }

  function fmt(seconds) {
    var m = Math.floor(seconds / 60), s = seconds % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  // ------------------------------------------------------------------ //
  // Live speech-to-text (browser). Instant feedback, not the final answer.
  // ------------------------------------------------------------------ //
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function startRecognition() {
    if (!SR) return;
    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = cfg.lang || document.documentElement.lang || "en-IN";
    recognition.maxAlternatives = 1;

    recognition.onresult = function (event) {
      interimText = "";
      for (var i = event.resultIndex; i < event.results.length; i++) {
        var chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalText += (finalText && !/\s$/.test(finalText) ? " " : "") + chunk.trim();
        } else {
          interimText += chunk;
        }
      }
      render();
    };

    recognition.onerror = function (event) {
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        setStatus("Microphone blocked — allow it in the browser and start again.");
        recognitionWanted = false;
      } else if (event.error === "no-speech") {
        setStatus("Listening — nothing heard yet.");
      }
    };

    // Chrome stops on its own after a pause; restart while the doctor is still going.
    recognition.onend = function () {
      if (recognitionWanted) {
        try { recognition.start(); } catch (e) { /* already starting */ }
      }
    };

    try { recognition.start(); } catch (e) { /* already started */ }
  }

  function stopRecognition() {
    recognitionWanted = false;
    if (recognition) {
      try { recognition.stop(); } catch (e) {}
      recognition = null;
    }
    if (interimText) {
      finalText += (finalText && !/\s$/.test(finalText) ? " " : "") + interimText;
      interimText = "";
      render();
    }
  }

  // ------------------------------------------------------------------ //
  // The cleaning graph. A real DSP chain feeding the recorder:
  //   source -> high-pass(85Hz) -> low-pass(8.5kHz) -> compressor
  //          -> noise gate -> destination
  // The high-pass kills fan/AC/mains rumble, the low-pass trims tape hiss
  // above the speech band, the compressor evens the level, and the gate
  // silences the gaps between phrases so the recogniser never chews on room
  // tone. Analyser taps the compressor output to drive both the gate and the
  // level meter, so the meter shows exactly what the recorder will hear.
  // Returns the stream to record. Falls back to the raw stream on any error.
  // ------------------------------------------------------------------ //
  function buildGraph(mediaStream) {
    if (!cfg.denoise) return mediaStream;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var source = audioCtx.createMediaStreamSource(mediaStream);

      var hp = audioCtx.createBiquadFilter();
      hp.type = "highpass"; hp.frequency.value = 85; hp.Q.value = 0.7;

      var lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 8500; lp.Q.value = 0.7;

      var comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -30; comp.knee.value = 24; comp.ratio.value = 3;
      comp.attack.value = 0.003; comp.release.value = 0.25;

      gateNode = audioCtx.createGain();
      gateNode.gain.value = 1;

      var dest = audioCtx.createMediaStreamDestination();

      source.connect(hp); hp.connect(lp); lp.connect(comp);
      comp.connect(gateNode); gateNode.connect(dest);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      comp.connect(analyser);   // tap BEFORE the gate, so we can decide to open it

      return dest.stream;
    } catch (e) {
      // Cleaning is a bonus, never a blocker.
      audioCtx = null; analyser = null; gateNode = null;
      return mediaStream;
    }
  }

  // When no graph is built (denoise off / unsupported), still meter the raw mic.
  function meterOnly(mediaStream) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var source = audioCtx.createMediaStreamSource(mediaStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      source.connect(analyser);
    } catch (e) { /* meter is a nicety, never fatal */ }
  }

  function runMeterAndGate() {
    if (!analyser) return;
    var data = new Uint8Array(analyser.fftSize);
    // Gate threshold: sensitivity 0 -> very permissive, 1 -> aggressive.
    var gateThresh = 0.006 + cfg.strength * 0.05;
    var openUntil = 0;
    var quietFor = 0;

    (function loop() {
      analyser.getByteTimeDomainData(data);
      var sum = 0, peak = 0;
      for (var i = 0; i < data.length; i++) {
        var v = (data[i] - 128) / 128;
        sum += v * v;
        peak = Math.max(peak, Math.abs(v));
      }
      var rms = Math.sqrt(sum / data.length);
      var now = (audioCtx ? audioCtx.currentTime : 0);

      // Noise gate with a short hold, so word-internal dips don't chop speech.
      var gated = false;
      if (gateNode && cfg.denoise) {
        if (rms > gateThresh) openUntil = now + 0.35;   // 350 ms hold
        var open = now < openUntil;
        gated = !open;
        var target = open ? 1 : 0;
        // Smooth the gain so it fades rather than clicks.
        gateNode.gain.setTargetAtTime(target, now, open ? 0.01 : 0.08);
      }

      var pct = Math.min(100, Math.round(peak * 260));
      if (gated) pct = Math.min(pct, 6);
      level.style.width = pct + "%";
      meter.classList.toggle("hot", pct > 88);
      meter.classList.toggle("gated", gated);

      quietFor = pct < 3 ? quietFor + 1 : 0;
      if (quietFor === 150) setStatus("Hearing nothing — check the microphone.");
      rafId = requestAnimationFrame(loop);
    })();
  }

  function stopAudio() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    level.style.width = "0%";
    meter.classList.remove("gated", "hot");
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
    analyser = null; gateNode = null;
  }

  // ------------------------------------------------------------------ //
  // Recording. The audio is what gets the accurate transcription.
  // ------------------------------------------------------------------ //
  startBtn.addEventListener("click", function () {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("This browser cannot record audio.");
      return;
    }
    navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1,
        sampleRate: 48000
      }
    }).then(function (s) {
      stream = s;
      chunks = [];
      finalText = box.innerText.replace(/ /g, " ").trim();  // keep anything already typed
      interimText = "";
      render();

      // Build the cleaning graph (or just a meter) and record its output.
      recordStream = buildGraph(stream);
      if (!analyser) meterOnly(stream);   // denoise off/failed - meter raw
      runMeterAndGate();

      var mime = "";
      ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"]
        .some(function (m) {
          if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mime = m; return true; }
          return false;
        });

      recorder = mime ? new MediaRecorder(recordStream, { mimeType: mime })
                      : new MediaRecorder(recordStream);
      recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = finish;
      recorder.start();

      recognitionWanted = true;
      startRecognition();

      startedAt = Date.now();
      tickId = setInterval(function () {
        timerEl.textContent = fmt(Math.floor((Date.now() - startedAt) / 1000));
      }, 500);

      dot.classList.add("live");
      startBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus(SR ? "Listening…" : "Recording (this browser has no live preview)");
      if (!SR) {
        hint.innerHTML = '<span class="warn">Live preview needs Chrome or Edge. Recording ' +
          'still works here, and the accurate transcription is unaffected.</span>';
      }
    }).catch(function () {
      setStatus("Microphone blocked. Allow it in the browser, then start again.");
    });
  });

  stopBtn.addEventListener("click", function () {
    stopBtn.disabled = true;
    setStatus("Finishing…");
    stopRecognition();
    if (tickId) { clearInterval(tickId); tickId = null; }
    dot.classList.remove("live");
    if (recorder && recorder.state !== "inactive") recorder.stop();
    else finish();
  });

  function finish() {
    // Stop the mic first, then tear the graph down.
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    stopAudio();
    var seconds = Math.round((Date.now() - startedAt) / 1000);
    var blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || "audio/webm" });

    if (blob.size > MAX_MB * 1024 * 1024) {
      setStatus("Recording too long (" + Math.round(blob.size / 1048576) + " MB). " +
                "Dictate in shorter passes.");
      startBtn.disabled = false;
      return;
    }

    var reader = new FileReader();
    reader.onloadend = function () {
      var base64 = String(reader.result).split(",")[1] || "";
      setValue({
        text: box.innerText.replace(/ /g, " ").trim(),
        audio: base64,
        mime: (blob.type || "audio/webm").split(";")[0],
        seconds: seconds,
        live_available: !!SR,
        denoised: !!cfg.denoise,
        nonce: Date.now()
      });
      setStatus("Done — " + fmt(seconds) + " recorded. Transcribing…");
      startBtn.disabled = false;
    };
    reader.readAsDataURL(blob);
  }

  // The doctor editing the box is the doctor's business; just keep the height right.
  box.addEventListener("input", function () {
    box.classList.toggle("empty", !box.innerText.trim());
    syncHeight();
  });

  describeNR();
  render();
  post("streamlit:componentReady", { apiVersion: 1 });
  syncHeight();
  if (window.ResizeObserver) {
    new ResizeObserver(syncHeight).observe(document.getElementById("root"));
  }
})();
</script>
</body>
</html>
