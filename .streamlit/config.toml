# Clinical palette: teal for anything the app is confident about, orange reserved
# for the one action on each screen, red only for a genuine failure. Chosen for
# WCAG AA contrast on white, because reports get read on bad monitors in bright
# rooms.

[theme]
base = "light"
primaryColor = "#0D9488"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F9F9"
textColor = "#12343B"
linkColor = "#0F766E"
codeBackgroundColor = "#F0FDFA"

# Fonts are named stacks, not web fonts, on purpose: a clinic PC may be
# air-gapped, and a report must not wait on a CDN that will never answer.
# Every family listed ships with Windows, macOS or a common Linux desktop; the
# browser takes the first one it has.
font = "\"Segoe UI Variable Text\", \"Segoe UI\", -apple-system, BlinkMacSystemFont, \"Inter\", Roboto, \"Helvetica Neue\", Arial, sans-serif"
headingFont = "\"Segoe UI Variable Display\", \"Segoe UI Semibold\", \"Segoe UI\", -apple-system, BlinkMacSystemFont, \"Inter\", Roboto, \"Helvetica Neue\", Arial, sans-serif"
codeFont = "\"Cascadia Mono\", \"JetBrains Mono\", Consolas, \"SF Mono\", \"Menlo\", \"DejaVu Sans Mono\", monospace"
baseFontSize = 16

baseRadius = "0.5rem"
borderColor = "#D8E3E3"
showWidgetBorder = true

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
# A radiology report is text. 25 MB is already generous and matches readers.MAX_BYTES.
maxUploadSize = 25

[browser]
gatherUsageStats = false
