# Render deployment.
#
# Render runs the app. The DATABASE LIVES ELSEWHERE, on purpose.
#
# Render's free Postgres has historically been deleted after 30 days, which for
# this app means every doctor template and everything it has learned disappears.
# Rather than build on that, the app points at a provider whose free tier is
# permanent. Neon is the usual choice: no expiry, and 0.5 GB is enormous for what
# this stores (text templates, not images).
#
# Nothing about the app changes - storage.py takes any postgres:// URL, so this
# is purely which URL you paste.
#
# THREE secrets are set once in the Render dashboard and never reach this repo:
#
#     STORAGE_URL      your Neon connection string (postgresql://...)
#     GEMINI_API_KEY   your key from aistudio.google.com
#     ACCESS_CODE      required: this is a public URL holding patient reports
#
# See DEPLOY.md for the walkthrough and for the backup you should run regardless.

services:
  - type: web
    name: radiology-report-maker
    runtime: python
    plan: free
    region: singapore          # closest Render region to India
    branch: main
    buildCommand: pip install -r requirements.txt
    # $PORT is assigned by Render; 0.0.0.0 so it accepts the proxied traffic.
    startCommand: >
      streamlit run app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS false
      --server.enableXsrfProtection true
      --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # sync: false means "ask me in the dashboard, never store it in git".
      - key: STORAGE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false

# ---------------------------------------------------------------------------
# If you would rather use Render's own database anyway - because you have
# upgraded it past the free tier, or you accept the expiry and will run the
# monthly backup - delete the STORAGE_URL entry above, uncomment both blocks
# below, and Render will wire the connection string in for you.
#
#      - key: STORAGE_URL
#        fromDatabase:
#          name: radiology-reports-db
#          property: connectionString
#
# databases:
