# Render deployment - Docker runtime.
#
# Docker, not Render's native Python runtime, because the app needs system
# packages a native runtime cannot install: ffmpeg (dictation audio) and
# tesseract-ocr (the free local OCR tier). The Dockerfile carries both.
#
# Render runs the app. The DATABASE LIVES ELSEWHERE, on purpose.
#
# Render's free Postgres has historically been deleted after 30 days, which for
# this app means every doctor template and everything it has learned disappears.
# Rather than build on that, the app points at a provider whose free tier is
# permanent. Neon is the usual choice: no expiry, and 0.5 GB is enormous for
# what this stores (text templates, not images).
#
# THREE secrets are set once in the Render dashboard and never reach this repo:
#
#     STORAGE_URL      your Neon connection string (postgresql://...)
#     GEMINI_API_KEY   your key from aistudio.google.com
#     ACCESS_CODE      required: this is a public URL holding patient reports
#
# Optional integrations are also plain environment variables - add whichever
# you use, in the dashboard, never here:
#
#     ALERT_SMTP_HOST / ALERT_SMTP_PORT / ALERT_SMTP_USER /
#     ALERT_SMTP_PASSWORD / ALERT_FROM      critical result alerts by email
#     TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM
#                                           alerts by SMS and WhatsApp
#     ORTHANC_URL / ORTHANC_USERNAME / ORTHANC_PASSWORD
#                                           browse the clinic's Orthanc PACS
#     HF_TOKEN                              hosted AI4Bharat speech
#     AI_PROVIDER                           model vendor (default: gemini)
#
# What does NOT work on Render: the DICOM C-STORE receiver. Render web
# services accept HTTPS only - no raw inbound TCP - so modalities cannot push
# here. That feature is for the clinic-LAN install; the Orthanc client path
# (outbound HTTPS) works from Render fine.
#
# See DEPLOY.md for the walkthrough and for the backup you should run anyway.

services:
  - type: web
    name: radiology-report-maker
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      # sync: false means "ask me in the dashboard, never store it in git".
      - key: STORAGE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false

# ---------------------------------------------------------------------------
