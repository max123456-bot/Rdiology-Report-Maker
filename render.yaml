# engine, not for browsers.
#
# COMMENTED OUT DELIBERATELY: api.py has no authentication of its own yet.
# Publishing it on a public URL would let anyone on the internet run report
# processing against your service. Enable it only behind Render's own access
# controls, an API gateway, or after adding auth - and understand that report
# text sent to it transits Render's infrastructure.
